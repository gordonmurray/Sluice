name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  payment-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Local settlement and receipt checks
        run: scripts/smoke.sh
      - name: Service logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.offline.yml logs --tail=100
      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.offline.yml down
